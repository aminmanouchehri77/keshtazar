{% extends '_base.html' %}
{% load static %}

{% block content %}
    <div class="page-title-area">
        <div class="d-table">
            <div class="d-table-cell">
                <div class="container">
                    <div class="page-title-content">
                        <h2>اعتبار سنجی</h2>
                        <ul>
                            <li><a href="{% url 'index' %}">خانه</a></li>
                            <li>اعتبار سنجی</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container-fluid agricultural-bg">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg rounded-4 border-success">
                    <div class="card-header bg-success text-white text-center py-4">
                        <h3 class="mb-0">
                            <i class="fas fa-shield-alt me-2"></i>
                            تایید شماره موبایل
                        </h3>
                    </div>

                    <div class="card-body p-5">
                        <p class="text-center mb-4">
                            کد تایید به شماره
                            <span class="fw-bold text-success">{{ mobile }}</span>
                            ارسال شد
                        </p>

                        <form method="POST" action="{% url 'accounts:verify' %}">
                            {% csrf_token %}

                            <div class="mb-4">
                                <label class="form-label text-success fw-bold">
                                    <i class="fas fa-lock me-2"></i>
                                    کد تایید ۶ رقمی
                                </label>
                                <input type="number"
                                       class="form-control form-control-lg text-center"
                                       name="otp"
                                       placeholder="- - - - - -"
                                       required
                                       autofocus>
                            </div>

                            <button type="submit"
                                    class="btn btn-success btn-lg w-100 rounded-pill py-3 fs-5">
                                تایید و ادامه
                                <i class="fas fa-check-circle ms-2"></i>
                            </button>
                        </form>

                        <div class="mt-4 text-center">
                            <p class="text-muted mb-2" id="countdown">
                                ارسال مجدد کد پس از ۲:۰۰
                            </p>
                            <a href="{% url 'accounts:resend_otp' %}"
                               class="btn btn-outline-success rounded-pill disabled"
                               id="resendBtn">
                                ارسال مجدد کد
                                <i class="fas fa-redo-alt ms-2"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 60; // تغییر زمان به ۶۰ ثانیه
        const countdown = document.getElementById('countdown');
        const resendBtn = document.getElementById('resendBtn');

        function updateTimerDisplay(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function startCountdown() {
            resendBtn.classList.add('disabled');
            resendBtn.setAttribute('disabled', true);

            const timer = setInterval(() => {
                timeLeft--;

                countdown.innerHTML =`
                    کد
                تایید
                تا
                <span

                class

                = "fw-bold text-danger" >${updateTimerDisplay(timeLeft)} </span>
                معتبر
                است
                `;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdown.textContent = 'کد منقضی شده است';
                    resendBtn.classList.remove('disabled');
                    resendBtn.removeAttribute('disabled');
                }
            }, 1000);
        }

        startCountdown();
    </script>
{% endblock %}
