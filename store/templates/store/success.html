{% extends '_base.html' %}

{% block title %}پرداخت موفق{% endblock %}

{% block content %}
    <div id="payment-success" class="container my-5">
        <div class="card shadow-lg border-success">
            <div class="card-header bg-success text-white d-flex justify-content-center align-items-center">
                <i class="fas fa-seedling me-2"></i>
                <h3 class="mb-0">پرداخت موفق – فروشگاه کشت آذر پاسارگاد</h3>
            </div>
            <div class="card-body text-center position-relative py-5">
                <!-- آیکون موفقیت و برگ‌ها -->
                <div class="success-icon d-inline-block mb-4">
                    <i class="fas fa-check-circle fa-5x text-success"></i>

                </div>

                <h4 class="text-dark mb-4">خرید شما با موفقیت ثبت شد!</h4>
                <div class="alert alert-success w-75 mx-auto">
                    <p class="mb-2">
                        <i class="fas fa-receipt me-2"></i>
                        کد پیگیری: <strong>{{ ref_id }}</strong>
                    </p>
                    <p class="mb-0">
                        <i class="fas fa-comment-alt me-2"></i>
                        {{ message }}
                    </p>
                </div>

                <div class="mt-4">
                    <a href="{% url 'index' %}" class="btn btn-success btn-lg me-2">
                        <i class="fas fa-home me-2"></i> بازگشت به صفحه اصلی
                    </a>
                    <a href="{% url 'order_detail' order.id %}" class="btn btn-outline-success btn-lg">
                        <i class="fas fa-shopping-basket me-2"></i> مشاهده سفارش
                    </a>
                </div>
            </div>
        </div>
    </div>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* استایل حرفه‌ای برای عنوان کارت */
        .card-header h3 {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700; /* ضخامت قلم */
            font-size: 1.8rem; /* اندازه بزرگ‌تر */
            letter-spacing: 0.5px; /* فاصلهٔ بین حروف */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2); /* سایهٔ ملایم زیر متن */
            margin: 0; /* حذف مارجین پیش‌فرض */
        }

        .card-header h3 {
            /* حداقل اندازه 1.2rem، حداکثر 1.8rem و مقدار ایده‌آل 2.5vw */
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            white-space: nowrap; /* برای جلوگیری از شکست خط */
            overflow: hidden; /* در صورت خیلی کوچک شدن، مخفی شدن اضافه */
            text-overflow: ellipsis; /* در صورت نیاز نشان دادن ... */
        }


        .card-header i {
            font-size: 1.4rem; /* کوچک‌تر کردن کمی آیکون */
            color: #eae71e; /* رنگ آیکون */
        }
    </style>

    <style>
        /* 1) متغیر CSS برای نگهداری ارتفاع نوبار */
        :root {
            --nav-height: 100px;
        }

        /* 2) کارت همواره زیر نوبار با فاصلهٔ ثابت 30px */
        #payment-success {
            margin-top: calc(var(--nav-height) + 30px) !important;
        }

    </style>

    <script>
        (function () {
            function updateNavHeight() {
                const nav = document.querySelector('nav.navbar.fixed-top');
                if (!nav) return;
                const h = nav.getBoundingClientRect().height;
                document.documentElement.style.setProperty('--nav-height', h + 'px');
            }

            document.addEventListener('DOMContentLoaded', updateNavHeight);
            window.addEventListener('resize', updateNavHeight);
        })();
    </script>
{% endblock %}
