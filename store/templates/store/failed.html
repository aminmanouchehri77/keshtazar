{% extends '_base.html' %}
{% block title %}
    پرداخت ناموفق
{% endblock %}
{% block content %}
    <div id="payment-failed" class="container my-5">
        <div class="card shadow-lg border-danger">
            <div class="card-header bg-danger text-white d-flex justify-content-center align-items-center ">
                <h3 class="mb-0">
                    پرداخت ناموفق - فروشگاه کشت آذر پاسارگاد
                </h3>
            </div>
            <div class="card-body text-center py-5">
                <div class="error-icon mb-4">
                    <i class="fas fa-times-circle fa-5x text-danger"></i>
                </div>

                <h4 class="text-dark mb-4">متاسفانه پرداخت انجام نشد...</h4>

                <div class="mt-4">
                    <a href="{% url 'cart_detail' %}" class="btn btn-danger btn-lg">
                        <i class="fas fa-shopping-cart me-2"></i>
                        بازگشت به سبد خرید
                    </a>
                </div>
            </div>
        </div>
    </div>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* استایل حرفه‌ای برای عنوان کارت */
        .card-header h3 {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700; /* ضخامت قلم */
            font-size: 1.8rem; /* اندازه بزرگ‌تر */
            letter-spacing: 0.5px; /* فاصلهٔ بین حروف */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2); /* سایهٔ ملایم زیر متن */
            margin: 0; /* حذف مارجین پیش‌فرض */
        }

        .card-header h3 {
            /* حداقل اندازه 1.2rem، حداکثر 1.8rem و مقدار ایده‌آل 2.5vw */
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            white-space: nowrap; /* برای جلوگیری از شکست خط */
            overflow: hidden; /* در صورت خیلی کوچک شدن، مخفی شدن اضافه */
            text-overflow: ellipsis; /* در صورت نیاز نشان دادن ... */
        }


        .card-header i {
            font-size: 1.4rem; /* کوچک‌تر کردن کمی آیکون */
            color: #ea541e; /* رنگ آیکون */
        }
    </style>

    <style>
        /* 1) متغیر CSS برای نگهداری ارتفاع نوبار */
        :root {
            --nav-height: 100px;
        }

        /* 2) کارت همواره زیر نوبار با فاصلهٔ ثابت 30px */
        #payment-failed {
            margin-top: calc(var(--nav-height) + 30px) !important;
        }

    </style>

    <script>
        (function () {
            function updateNavHeight() {
                const nav = document.querySelector('nav.navbar.fixed-top');
                if (!nav) return;
                const h = nav.getBoundingClientRect().height;
                document.documentElement.style.setProperty('--nav-height', h + 'px');
            }

            document.addEventListener('DOMContentLoaded', updateNavHeight);
            window.addEventListener('resize', updateNavHeight);
        })();
    </script>
{% endblock %}
